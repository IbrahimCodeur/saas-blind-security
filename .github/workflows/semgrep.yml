# saas-blind-security — Semgrep SAST with SaaS-specific rules (+ optional registry rules).
# Created and maintained by IbrahimCodeur — https://github.com/IbrahimCodeur/saas-blind-security
# No account or token is required.
#   vars.SBS_FAIL_ON_SEVERITY   blocking level (CRITICAL|HIGH|MEDIUM|LOW|INFO|NONE), default HIGH
#   vars.SBS_SEMGREP_CONFIGS    extra registry configs, default "p/owasp-top-ten" (set to "none" to disable)
name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      SEMGREP_VERSION: "1.184.0"
      SBS_FAIL_ON_SEVERITY: ${{ vars.SBS_FAIL_ON_SEVERITY || 'HIGH' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Locate framework
        run: |
          if [ -d .saas-blind-security ]; then echo "SBS_HOME=.saas-blind-security" >> "$GITHUB_ENV"; else echo "SBS_HOME=." >> "$GITHUB_ENV"; fi
      - name: Run Semgrep
        id: scan
        env:
          CONFIGS: ${{ vars.SBS_SEMGREP_CONFIGS || 'p/owasp-top-ten' }}
        run: |
          if [ "$CONFIGS" = "none" ]; then export SBS_SEMGREP_CONFIGS=""; else export SBS_SEMGREP_CONFIGS="$CONFIGS"; fi
          set +e
          "$SBS_HOME/scripts/security-check.sh" --only semgrep --fail-on "$SBS_FAIL_ON_SEVERITY" --output sbs-out --report .
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ -f sbs-out/report.md ] && cat sbs-out/report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('sbs-out/raw/semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: sbs-out/raw/semgrep.sarif
          category: semgrep
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: |
            sbs-out/report.md
            sbs-out/findings.json
            sbs-out/tools.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce severity threshold
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          case "$RC" in
            0) echo "No Semgrep finding at or above $SBS_FAIL_ON_SEVERITY." ;;
            1) echo "::error::Semgrep findings at or above $SBS_FAIL_ON_SEVERITY. See the job summary."; exit 1 ;;
            *) echo "::error::Semgrep did not complete (exit $RC). Results are incomplete."; exit 1 ;;
          esac
