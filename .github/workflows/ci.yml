# saas-blind-security — self-tests of the framework (this repository only; not installed into projects).
# Created and maintained by IbrahimCodeur — https://github.com/IbrahimCodeur/saas-blind-security
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (shellcheck, actionlint, yamllint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --disable-pip-version-check yamllint shellcheck-py
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint && rm actionlint.tar.gz
      - name: shellcheck
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: actionlint
        run: ./actionlint -color
      - name: yamllint
        run: yamllint -c .yamllint.yml .

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      SEMGREP_VERSION: "1.184.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: Semgrep rule tests
        run: semgrep --test --metrics=off --config config/semgrep/rules tests/semgrep
      - name: Framework tests
        run: ./tests/run-tests.sh
