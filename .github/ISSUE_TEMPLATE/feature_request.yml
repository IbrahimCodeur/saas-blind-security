name: Feature request
description: Suggest a rule, detection, skill or integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Security problem or coverage gap
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: refs
    attributes:
      label: References (OWASP, CWE, official docs)
