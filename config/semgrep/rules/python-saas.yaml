# saas-blind-security — Python (Django, FastAPI, Flask) rules.
# Created and maintained by IbrahimCodeur. SPDX-License-Identifier: MIT
rules:
  - id: sbs-py-sqli-string-formatting
    languages: [python]
    severity: ERROR
    message: >-
      SQL built with f-string / % / .format / concatenation. Pass parameters separately:
      cursor.execute("... WHERE id = %s", [user_id]) or use the ORM.
    metadata:
      sbs-severity: CRITICAL
      category: security
      cwe: ["CWE-89: SQL Injection"]
      owasp: ["A03:2021 - Injection"]
    pattern-either:
      - pattern: $C.execute(f"...", ...)
      - pattern: $C.execute("..." % $X, ...)
      - pattern: $C.execute("...".format(...), ...)
      - pattern: $C.execute("..." + $X, ...)
      - pattern: $M.objects.raw(f"...", ...)
      - pattern: $M.objects.raw("..." % $X, ...)
      - pattern: $M.objects.raw("...".format(...), ...)
      - pattern: $M.objects.extra(where=[f"..."], ...)
      - pattern: text(f"...")
      - pattern: $S.execute(text(f"..."), ...)

  - id: sbs-py-insecure-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      pickle / yaml.load without SafeLoader can execute arbitrary code when the input is attacker-controlled.
      Use json, or yaml.safe_load().
    metadata:
      sbs-severity: CRITICAL
      category: security
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: dill.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)

  - id: sbs-py-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: JWT signature verification is disabled — tokens can be forged. Verify with an explicit algorithms list.
    metadata:
      sbs-severity: CRITICAL
      category: security
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)

  - id: sbs-py-django-mark-safe-variable
    languages: [python]
    severity: WARNING
    message: mark_safe()/SafeString on a non-constant value disables Django auto-escaping (XSS). Use format_html().
    metadata:
      category: security
      cwe: ["CWE-79: Cross-site Scripting"]
    patterns:
      - pattern-either:
          - pattern: mark_safe($X)
          - pattern: SafeString($X)
      - pattern-not: mark_safe("...")
      - pattern-not: SafeString("...")

  - id: sbs-py-csrf-exempt
    languages: [python]
    severity: WARNING
    message: >-
      View exempted from CSRF protection. Acceptable only for endpoints authenticated by something other than cookies
      (e.g. signed webhooks with signature verification, token-auth APIs). Document why.
    metadata:
      category: security
      cwe: ["CWE-352: Cross-Site Request Forgery"]
    pattern: |
      @csrf_exempt
      def $F(...):
        ...

  - id: sbs-py-ssrf-request-url
    languages: [python]
    severity: ERROR
    message: >-
      A URL from the request is fetched server-side (SSRF). Validate the host against an allow-list and block
      private / link-local / metadata addresses after DNS resolution.
    metadata:
      category: security
      cwe: ["CWE-918: Server-Side Request Forgery (SSRF)"]
      owasp: ["A10:2021 - Server-Side Request Forgery"]
    pattern-either:
      - pattern: requests.$M(request.GET.get(...), ...)
      - pattern: requests.$M(request.POST.get(...), ...)
      - pattern: requests.$M(request.args.get(...), ...)
      - pattern: requests.$M(request.query_params.get(...), ...)
      - pattern: httpx.$M(request.query_params.get(...), ...)
      - pattern: urllib.request.urlopen(request.GET.get(...), ...)

  - id: sbs-py-weak-password-hash
    languages: [python]
    severity: ERROR
    message: Fast hash used on a password. Use Django's make_password, passlib/argon2 or bcrypt.
    metadata:
      category: security
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
    patterns:
      - pattern-either:
          - pattern: hashlib.md5($P)
          - pattern: hashlib.sha1($P)
          - pattern: hashlib.sha256($P)
          - pattern: hashlib.md5($P.encode(...))
          - pattern: hashlib.sha256($P.encode(...))
      - metavariable-regex:
          metavariable: $P
          regex: (?i).*(pass|pwd).*

  - id: sbs-py-weak-random-token
    languages: [python]
    severity: WARNING
    message: The random module is not cryptographically secure. Use secrets.token_urlsafe() / secrets.token_hex().
    metadata:
      category: security
      cwe: ["CWE-338: Use of Cryptographically Weak PRNG"]
    patterns:
      - pattern-either:
          - pattern: $T = random.$F(...)
          - pattern: $T = "".join(random.choice(...) for $I in $R)
          - pattern: $T = ''.join(random.choices(...))
      - metavariable-regex:
          metavariable: $T
          regex: (?i).*(token|secret|nonce|otp|reset|code|key|password).*

  - id: sbs-py-fastapi-cors-wildcard-credentials
    languages: [python]
    severity: ERROR
    message: CORS allows every origin with credentials. Use an explicit list of allowed origins.
    metadata:
      category: security
      cwe: ["CWE-942: Permissive Cross-domain Policy"]
    pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)

  - id: sbs-py-path-traversal-open
    languages: [python]
    severity: ERROR
    message: File path built from request data. Resolve it and check it stays inside the allowed directory.
    metadata:
      category: security
      cwe: ["CWE-22: Path Traversal"]
    pattern-either:
      - pattern: open(<... request.GET.get(...) ...>, ...)
      - pattern: open(<... request.args.get(...) ...>, ...)
      - pattern: FileResponse(<... request.query_params.get(...) ...>, ...)
      - pattern: send_file(<... request.args.get(...) ...>, ...)

  - id: sbs-py-django-debug-true
    languages: [python]
    severity: WARNING
    message: DEBUG = True hardcoded in settings. Read it from the environment and default to False in production.
    metadata:
      category: security
      cwe: ["CWE-489: Active Debug Code"]
    paths:
      include: ["*settings*.py"]
    pattern: DEBUG = True
