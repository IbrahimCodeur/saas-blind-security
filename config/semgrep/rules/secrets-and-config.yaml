# saas-blind-security — hardcoded secrets and insecure configuration (language independent).
# Created and maintained by IbrahimCodeur. SPDX-License-Identifier: MIT
rules:
  - id: sbs-hardcoded-credential-assignment
    languages: [javascript, typescript, python, php]
    severity: ERROR
    message: >-
      A credential appears to be hardcoded. Move it to an environment variable or a secret manager,
      then revoke and rotate the exposed value.
    metadata:
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    patterns:
      - pattern-either:
          - pattern: $K = "$V"
          - pattern: 'const $K = "$V"'
          - pattern: '{..., $K: "$V", ...}'
          - pattern: $K = '$V'
      - metavariable-regex:
          metavariable: $K
          regex: (?i)^["']?[a-z0-9_$]*(api_?key|secret(_?key)?|client_?secret|password|passwd|private_?key|access_?token|auth_?token|jwt_?secret|webhook_?secret|signing_?key)["']?$
      - metavariable-regex:
          metavariable: $V
          regex: ^[^\s${}<>%]{8,}$
      - metavariable-regex:
          metavariable: $V
          regex: (?i)^(?!.*(example|changeme|change_me|placeholder|your[_-]|xxx|dummy|test|sample|redacted|\*\*\*)).*$
      - focus-metavariable: $V

  - id: sbs-known-token-format
    languages: [generic]
    severity: ERROR
    message: >-
      A value matching a documented live-credential format was found (Stripe live key, AWS key id, GitHub token,
      Slack token, private key). Revoke and rotate it, then purge it from git history.
    metadata:
      sbs-severity: CRITICAL
      category: security
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
    paths:
      exclude: ["*.lock", "package-lock.json", "*.min.js"]
    pattern-either:
      - pattern-regex: '\bsk_live_[0-9A-Za-z]{20,}'
      - pattern-regex: '\brk_live_[0-9A-Za-z]{20,}'
      - pattern-regex: '\bAKIA[0-9A-Z]{16}\b'
      - pattern-regex: '\bghp_[0-9A-Za-z]{36}\b'
      - pattern-regex: '\bgithub_pat_[0-9A-Za-z_]{40,}'
      - pattern-regex: '\bxox[abprs]-[0-9A-Za-z-]{10,}'
      - pattern-regex: '-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----'

  - id: sbs-laravel-app-debug-production
    languages: [generic]
    severity: ERROR
    message: APP_DEBUG=true in a production environment file exposes stack traces, configuration and secrets.
    metadata:
      category: security
      cwe: ["CWE-489: Active Debug Code"]
    paths:
      include: ["*.env.production", "*.env.prod", "production.env"]
    pattern-regex: '(?m)^\s*APP_DEBUG\s*=\s*"?(true|1)"?\s*$'

  - id: sbs-session-cookie-insecure
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Session/cookie configured without secure flags. Set httpOnly: true, secure: true (HTTPS) and sameSite: 'lax' or 'strict'.
    metadata:
      category: security
      cwe: ["CWE-614: Sensitive Cookie Without Secure Flag", "CWE-1004: Sensitive Cookie Without HttpOnly"]
    pattern-either:
      - pattern: '{..., httpOnly: false, ...}'
      - pattern: 'session({..., cookie: {..., secure: false, ...}, ...})'
