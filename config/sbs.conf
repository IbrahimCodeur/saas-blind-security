# Configuration used when saas-blind-security audits ITS OWN repository.
# Projects that install the framework get a copy of sbs.conf.example instead.
SBS_FAIL_ON_SEVERITY=HIGH
# Intentionally vulnerable test fixtures and rule test files are excluded from self-audits.
SBS_EXCLUDE_PATHS=tests/fixtures tests/semgrep
SBS_SEMGREP_CONFIGS=p/owasp-top-ten
